---
name: Rust Coverage

on: # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Rust Coverage
    runs-on: ubuntu-26.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        run: rustup update stable
      - name: Install Clippy
        run: rustup component add clippy
      - name: Install cargo-llvm-cov
        run: >
          cargo install cargo-llvm-cov
      - name: Install cargo-sonar and run Clippy
        run: |
            cargo install cargo-sonar
            cargo clippy --message-format json > my-clippy-report.json
            cargo sonar --clippy --clippy-path my-clippy-report.json
      - name: Run tests with coverage instrumentation
        run: >
          make coverage/test

      # yamllint disable rule:line-length
      - name: Generate coverage summary in GitHub job summary
        run: |
          cargo llvm-cov report --summary-only --json --output-path coverage-summary.json

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open("coverage-summary.json") as f:
              report = json.load(f)

          rows = []
          for bucket in report.get("data", []):
              for item in bucket.get("files", []):
                  filename = item.get("filename", "")
                  summary = item.get("summary", {})
                  rows.append((
                      filename,
                      summary.get("lines", {}).get("percent", 0.0),
                      summary.get("functions", {}).get("percent", 0.0),
                      summary.get("regions", {}).get("percent", 0.0),
                  ))

          print("## Coverage by file")
          print("")
          print("| File | Lines | Functions | Regions |")
          print("| --- | ---: | ---: | ---: |")
          for filename, lines, functions, regions in sorted(rows):
              print(f"| {filename} | {lines:.1f}% | {functions:.1f}% | {regions:.1f}% |")
          PY

      # yamllint enable rule:line-length
      - name: Generate coverage report file
        run: >
          make coverage/report

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            lcov.info
            my-clippy-report.json
            sonar-issues.json

  codecov:
    name: Upload to Codecov
    runs-on: ubuntu-26.04
    needs: coverage

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        with:
          fetch-depth: 0
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report

      # yamllint disable rule:line-length
      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }} # required
          verbose: true # optional (default = false)
          # yamllint enable rule:line-length

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-26.04
    needs: coverage

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
      # yamllint disable rule:line-length
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.externalIssuesReportPaths=sonar-issues.json
            -Dsonar.rust.clippy.reportPaths=my-clippy-report.json
      # yamllint enable rule:line-length
